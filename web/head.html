<title>전국 학사일정 분석</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 좌측 고정 내비 + 우측 작업영역(필터바 → 요약 → 차트 → 표). 모바일은 상단 가로 탭. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f7f9fb; --ink:#141a22; --ink2:#465061; --muted:#727c8d;
  --line:#e0e5eb; --line2:#edf0f4;
  --accent:#1d5fb4; --accent-ink:#ffffff; --accent-soft:#e7effa;
  --s-exam:#2a78d6; --s-open:#eb6834; --s-vac:#1baf7a; --s-disc:#e87ba4; --s-grad:#6250d6; --s-eval:#eda100;
  --g1:#2a78d6; --g2:#eb6834; --g3:#1baf7a;
  --warn-bg:#fff5d9; --warn-ink:#6b4a00; --warn-line:#efc65a;
  --bad:#c23434; --good:#0b8a0b; --today:#c23434;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b20; --surface2:#1d2228; --ink:#eef1f5; --ink2:#b9c0cb; --muted:#8a93a0;
  --line:#2b313a; --line2:#222830; --accent:#76abf2; --accent-ink:#0a1729; --accent-soft:#1a2a3f;
  --s-exam:#3987e5; --s-open:#d95926; --s-vac:#199e70; --s-disc:#d55181; --s-grad:#9085e9; --s-eval:#c98500;
  --g1:#3987e5; --g2:#d95926; --g3:#199e70;
  --warn-bg:#352a0f; --warn-ink:#f3d58a; --warn-line:#7a5d17; --bad:#e66767; --good:#3cc23c; --today:#e66767;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b20; --surface2:#1d2228; --ink:#eef1f5; --ink2:#b9c0cb; --muted:#8a93a0;
  --line:#2b313a; --line2:#222830; --accent:#76abf2; --accent-ink:#0a1729; --accent-soft:#1a2a3f;
  --s-exam:#3987e5; --s-open:#d95926; --s-vac:#199e70; --s-disc:#d55181; --s-grad:#9085e9; --s-eval:#c98500;
  --g1:#3987e5; --g2:#d95926; --g3:#199e70;
  --warn-bg:#352a0f; --warn-ink:#f3d58a; --warn-line:#7a5d17; --bad:#e66767; --good:#3cc23c; --today:#e66767;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
a{color:var(--accent)}
.sample-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--warn-line);
  padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.sample-bar.real{background:var(--surface);color:var(--ink2);border-bottom-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.chip.sample{background:var(--warn-ink);color:var(--warn-bg)}
.chip.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.chip.mute{background:var(--line2);color:var(--ink2)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 34px);height:calc(100vh - 34px);overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink2);font-weight:500}
.navlist a .no{font-size:11px;color:var(--muted);width:16px}
.navlist a:hover{background:var(--surface2)}
.navlist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlist a[aria-current="page"] .no{color:var(--accent)}
.navgroup{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:10px 10px 2px}
.status-box{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12px;color:var(--ink2);display:grid;gap:4px}
.status-box b{color:var(--ink);font-weight:600}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1440px}
.page-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.page-head h2{font-size:21px;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--ink2);max-width:72ch}
.filters{display:flex;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.03em}
.filters select,.filters input{min-width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);font-size:13px}
.filters select:focus-visible,.filters input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.notice{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 14px}
.notice.info{border-color:var(--line);background:var(--surface2);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15px}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:80ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.chart text{font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl-tools input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);min-width:180px;font-size:13px}
.tbl-tools .cnt{color:var(--muted);font-size:12px;margin-right:auto}
.tbl-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);z-index:1;font-weight:600;color:var(--ink2);font-size:12px}
th button{all:unset;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
th button:focus-visible{outline:2px solid var(--accent)}
td.num,th.num{text-align:right}
tbody tr:hover{background:var(--surface2)}
tbody tr.clickable{cursor:pointer}
tbody tr.sel{background:var(--accent-soft)}
td.dim{color:var(--muted)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 9px;border-radius:6px;white-space:pre-line;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.18);line-height:1.45}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:6px;z-index:60;font-size:13px}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.month h4{margin:0 0 4px;font-size:13px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgrid .dh{font-size:10px;color:var(--muted);text-align:center}
.day{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:3px;font-size:10.5px;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 3px;cursor:pointer;color:var(--ink2);background:var(--surface2);border:1px solid transparent}
.day.empty{background:transparent;cursor:default}
.day.we{color:var(--muted)}
.day.focus-win{border-color:var(--ink)}
.day.focus-win3{border:1px dashed var(--ink)}
.day.focus-both{border:2px solid var(--ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--today)}
.day.picked{outline:2px solid var(--accent);outline-offset:1px}
.day .vac{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--s-vac);border-radius:0 0 3px 3px}
.day .dots{position:absolute;right:2px;top:2px;display:flex;gap:1px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.hot{color:var(--accent-ink)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.list{display:grid;gap:6px;font-size:13px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2);padding-bottom:5px}
.list li span:last-child{color:var(--ink2);text-align:right}
.bar-row{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12px}
.bar-row .track{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--s-exam);border-radius:4px}
.prose{max-width:80ch;color:var(--ink2)}
.prose h3{color:var(--ink);font-size:15px;margin:18px 0 6px}
.prose code{background:var(--line2);padding:1px 5px;border-radius:4px;font-size:12px}
.prose li{margin-bottom:4px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.done li::marker{content:"✓  ";color:var(--good)}
.todo li::marker{content:"○  ";color:var(--muted)}
.school-list{display:grid;gap:4px;max-height:420px;overflow:auto}
.school-list button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;cursor:pointer}
.school-list button:hover,.school-list button.on{border-color:var(--accent);background:var(--accent-soft)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;font-size:13px}
.meta-grid div span{display:block;font-size:11px;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:1100px){.cal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.two-col{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .sample-bar{position:static;font-size:12px}
  body::before{display:none}
  nav.side{top:0}
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) 8px}
  .navlist{flex-direction:row;overflow-x:auto;gap:4px}
  .navlist a{flex:none}
  .navgroup,.status-box{display:none}
  .grid2,.cols2{grid-template-columns:minmax(0,1fr)}
  .cal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){.cal-grid{grid-template-columns:minmax(0,1fr)}.filters select{min-width:0;width:100%}.filters label{flex:1 1 40%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="sample-bar" id="srcBar" role="status"><span>데이터를 불러오는 중…</span></div>
<div class="app">
  <nav class="side" aria-label="분석 화면">
    <div class="brand"><h1>전국 학사일정 분석</h1><p>NEIS 학사일정 · 초·중·고 17개 시·도</p></div>
    <div class="navlist" id="nav"></div>
    <div class="status-box" id="statusBox"></div>
  </nav>
  <main id="main"><div class="loading">데이터를 준비하는 중…</div></main>
</div>
<div class="tip" id="tip" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
